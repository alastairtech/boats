server {
    listen 80;
    server_name _;
    root /var/www/boats;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    # The page and game code change with each release: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Three.js is versioned and never changes.
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
